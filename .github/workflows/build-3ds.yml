name: Build 3DS toolchain smoke test

# This replaces the earlier version of this workflow, which tried to
# build the full emulator through two profiles (legacy/n3ds) against
# dosbox-staging's own CMakeLists.txt. That target doesn't exist yet and,
# as written, would have gone through dosbox-staging's root CMakeLists.txt
# - wrong, see platform/ctr/CMakeLists.txt's own comment for why.
#
# Current job: confirm devkitARM + CMake + this CI container can produce
# a working .3dsx from platform/ctr/CMakeLists.txt's standalone smoke-test
# project (hello/main.c), and let you download it to actually try on the
# New3DS XL. Once that's confirmed working on real hardware, this
# workflow is where the real two-profile emulator build (legacy/n3ds)
# gets reintroduced, once platform/ctr/CMakeLists.txt has a second target
# for it.

on:
  push:
    branches: [ "staging-port" ]
  pull_request:
    branches: [ "staging-port" ]
  workflow_dispatch:

jobs:
  smoketest:
    name: Toolchain smoke test
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
        run: |
          cmake -S platform/ctr -B build-smoketest \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/toolchain/devkitarm-3ds.cmake"

      - name: Build
        run: cmake --build build-smoketest --verbose

      - name: Upload .3dsx
        uses: actions/upload-artifact@v4
        with:
          name: hello-3dsx
          path: |
            build-smoketest/hello.3dsx
            build-smoketest/hello.smdh
          if-no-files-found: error